[project]
name = "get-the-notes"
version = "0.1.0"
description = "Turn a song into a falling-notes piano tutorial video"
readme = "README.md"
authors = [
    { name = "Fernan", email = "fernanzabalalodoli@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "rq>=1.16",
    "torch>=2.3",
    "torchaudio>=2.3",
    "demucs>=4.0.1",
    "basic-pitch[onnx]>=0.4",
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pretty-midi>=0.2.10",
    "pillow>=10.4",
    "imageio-ffmpeg>=0.5",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
get-the-notes = "get_the_notes.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# basic-pitch pins tensorflow<2.15, which is incompatible with numpy 2.
# Drop it entirely; basic-pitch falls back to its bundled ONNX model.
override-dependencies = ["tensorflow; sys_platform == 'never'", "tensorflow-macos; sys_platform == 'never'"]
