services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      GTN_REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
    depends_on:
      - redis

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["rq", "worker", "gtn", "--url", "redis://redis:6379/0"]
    environment:
      GTN_REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
    depends_on:
      - redis

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  data:
  redis:
